name: Flow

on:
  pull_request:
    branches:
      - f24
  workflow_dispatch:

jobs:
  flow:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Install Flow
      run: npm install --save-dev flow-bin

    - name: Run Flow
      run: npx flow
